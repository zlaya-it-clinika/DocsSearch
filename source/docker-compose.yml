# Весь DocsSearch одной командой: PostgreSQL с pgvector, ядро на Go и веб на Node.js.
# Запуск из каталога source: cp .env.example .env, задать DOCS_PASSWORD, затем docker compose up -d --build
# Ollama по умолчанию берётся с хоста. Ollama в контейнере: docker compose --profile ollama up -d --build
# Тестовый каталог LDAP для проверки входа: docker compose --profile ldap up -d (см. LDAP_DEMO.md)
name: docssearch

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docs}
      POSTGRES_DB: ${POSTGRES_DB:-docssearch}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
    # Наружу база не публикуется: к ней ходит только ядро внутри сети compose
    restart: unless-stopped

  api:
    build: ./core
    image: docssearch-api:local
    environment:
      API_MODE: ${API_MODE:-live}
      API_PORT: "8080"
      DEBUG: ${DEBUG:-false}
      DOCS_PASSWORD: ${DOCS_PASSWORD:?Задайте DOCS_PASSWORD в source/.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-docs}:${POSTGRES_PASSWORD:-docs}@postgres:5432/${POSTGRES_DB:-docssearch}?sslmode=disable
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-vikhr-nemo}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_DIMENSIONS: ${OLLAMA_EMBED_DIMENSIONS:-768}
      # Вход и регистрация: начальные значения, дальше настраиваются в админ-панели
      STUB_SEED_USERS: ${STUB_SEED_USERS:-true}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-pending}
      SHOW_ADMIN_DETAILS: ${SHOW_ADMIN_DETAILS:-true}
      ENABLE_LDAP: ${ENABLE_LDAP:-false}
      LDAP_SERVER_LABEL: ${LDAP_SERVER_LABEL:-LDAP}
      LDAP_SERVER_HOST: ${LDAP_SERVER_HOST:-}
      LDAP_SERVER_PORT: ${LDAP_SERVER_PORT:-}
      LDAP_APP_DN: ${LDAP_APP_DN:-}
      LDAP_APP_PASSWORD: ${LDAP_APP_PASSWORD:-}
      LDAP_ATTRIBUTE_FOR_USERNAME: ${LDAP_ATTRIBUTE_FOR_USERNAME:-sAMAccountName}
      LDAP_ATTRIBUTE_FOR_MAIL: ${LDAP_ATTRIBUTE_FOR_MAIL:-mail}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
      LDAP_SEARCH_FILTERS: ${LDAP_SEARCH_FILTERS:-}
      LDAP_USE_TLS: ${LDAP_USE_TLS:-false}
      LDAP_CA_CERT_FILE: ${LDAP_CA_CERT_FILE:-}
      LDAP_VALIDATE_CERT: ${LDAP_VALIDATE_CERT:-true}
      LDAP_CIPHERS: ${LDAP_CIPHERS:-ALL}
      ENABLE_LDAP_GROUP_MANAGEMENT: ${ENABLE_LDAP_GROUP_MANAGEMENT:-false}
      LDAP_ATTRIBUTE_FOR_GROUPS: ${LDAP_ATTRIBUTE_FOR_GROUPS:-memberOf}
    # Сертификат CA компании для LDAPS: положить в source/certs, раскомментировать
    # и указать путь /certs/<файл>.pem в LDAP_CA_CERT_FILE или в админ-панели
    # volumes:
    #   - ./certs:/certs:ro
    # Только для отладки с этой машины: страница /docs ядра. Браузеры сотрудников ходят через веб
    ports:
      - "127.0.0.1:${API_PORT_LOCAL:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/docs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    image: docssearch-web:local
    environment:
      DEBUG: ${DEBUG:-false}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
      CORE_API_URL: http://api:8080
      CORE_TIMEOUT_MS: ${CORE_TIMEOUT_MS:-120000}
      ADMIN_ACCESS_LEVEL: ${ADMIN_ACCESS_LEVEL:-2}
      USER_ACCESS_LEVEL: ${USER_ACCESS_LEVEL:-1}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.txt .pdf .docx}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # Ollama в контейнере, если на хосте её нет. Включается профилем ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Однократно готовит модели в томе ollama-models и завершается.
  # Чат-модель собирается из Modelfile в source/ollama (параметры генерации), без Modelfile - просто скачивается
  ollama-models:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-vikhr-nemo}
      CHAT_MODELFILE: ${OLLAMA_CHAT_MODELFILE-vikhr-nemo.Modelfile}
    volumes:
      - ./ollama:/modelfiles:ro
    working_dir: /modelfiles
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull "$$EMBED_MODEL"
        if [ -n "$$CHAT_MODELFILE" ]; then
          base=$$(grep -m1 '^FROM ' "$$CHAT_MODELFILE" | cut -d' ' -f2)
          case "$$base" in ./*|/*) ;; *) ollama pull "$$base" ;; esac
          ollama create "$$CHAT_MODEL" -f "$$CHAT_MODELFILE"
        else
          ollama pull "$$CHAT_MODEL"
        fi
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Каталог LDAP для проверки входа без Active Directory компании: LLDAP с веб-интерфейсом.
  # Сотрудников и группы создают в нём руками, ядро ходит к нему по адресу ldap:3890. Включается профилем ldap
  ldap:
    image: lldap/lldap:v0.6.1
    profiles: ["ldap"]
    environment:
      LLDAP_LDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=docssearch,dc=local}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD:-}
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:-}
      LLDAP_KEY_SEED: ${LLDAP_KEY_SEED:-}
    volumes:
      - ldap-data:/data
    # Веб-интерфейс каталога только с этой машины
    ports:
      - "127.0.0.1:${LLDAP_WEB_PORT:-17170}:17170"
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-models:
  ldap-data:
